services:
  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: puu-tracker-app
    restart: always
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-puu_admin}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-puu_tracker}?schema=public
      - NEXTAUTH_URL=http://localhost:3006
      - AUTH_TRUST_HOST=true
      - AUTH_URL=http://localhost:3006/api/auth
      - AUTH_SECRET=${AUTH_SECRET:?required}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GOOGLE_VISION_API_KEY=${GOOGLE_VISION_API_KEY}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-puu-documents}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@test.com}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-password123456}
      - BOOTSTRAP_SEED_TOKEN=${BOOTSTRAP_SEED_TOKEN:-puu-seed}
      - DOCLING_API_URL=http://docling-serve:5001
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      docling-serve:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: puu-tracker-postgres
    restart: always
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-puu_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required}
      - POSTGRES_DB=${POSTGRES_DB:-puu_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-puu_admin} -d ${POSTGRES_DB:-puu_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio
    container_name: puu-tracker-minio
    restart: always
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}; /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME:-puu-documents}; /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_NAME:-puu-documents}; exit 0; "

  docling-serve:
    image: quay.io/docling-project/docling-serve-cpu:v1.29.0
    container_name: puu-tracker-docling
    restart: always
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  minio_data:
